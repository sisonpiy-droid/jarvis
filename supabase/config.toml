# Minimal Supabase CLI config — only used to deploy the Edge Function.
project_id = "jarvis"

[functions.mesa-sync]
# Called by pg_cron with a shared secret (checked in code), not a user JWT.
verify_jwt = false
# Pre-bundled by `npm run edge:build` from packages/* (see entry.ts).
entrypoint = "./functions/mesa-sync/index.js"

[functions.telegram-bot]
# Telegram authenticates with the webhook secret header (checked in code).
verify_jwt = false
entrypoint = "./functions/telegram-bot/index.js"

[functions.assignment-draft]
# Called by mesa-sync / telegram-bot with the shared secret (checked in code).
verify_jwt = false
entrypoint = "./functions/assignment-draft/index.js"
